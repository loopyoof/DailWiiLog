name: Build Daily Log
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm wii-dev ppc-freetype ppc-libpng ppc-libjpeg-turbo ppc-zlib ppc-libvorbisidec ppc-brotli ppc-bzip2 ppc-ogg
      - name: Build GRRLIB
        run: |
          git clone --depth 1 https://github.com/GRRLIB/GRRLIB.git /tmp/GRRLIB
          make -C /tmp/GRRLIB/GRRLIB clean all install
      - name: Build Daily Log
        run: make install
      - uses: actions/upload-artifact@v4
        with:
          name: dailylog
          path: sdcard/apps/dailylog
